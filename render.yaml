services:
  - type: web
    name: live-wordcloud
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm install @rolldown/binding-linux-x64-gnu@1.2.14 --legacy-peer-deps --no-save && npm run build
    startCommand: npm run start
    healthCheckPath: /api/state
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        value: admin
